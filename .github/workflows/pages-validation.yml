name: Validate scCCVGBen Pages workflow

on:
  pull_request:
    paths:
      - '.github/workflows/pages.yml'
      - '.github/workflows/pages-validation.yml'
      - '.github/approved-scCCVGBen-source-shas.txt'
      - 'scripts/check-pages-workflow.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run workflow checker and self-test
        run: |
          node scripts/check-pages-workflow.mjs
          node scripts/check-pages-workflow.mjs --self-test

      - name: Check JavaScript syntax
        run: node --check scripts/check-pages-workflow.mjs

      - name: Parse workflow YAML
        run: ruby -e "require 'yaml'; ARGV.each { |path| YAML.parse_file(path) }" .github/workflows/pages.yml .github/workflows/pages-validation.yml
